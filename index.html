<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HKH Glacier Watch</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link rel="preconnect" href="https://api.mapbox.com" />
<style>
  :root {
    --bar-height: 64px;
    --bg: #0b0f14;
    --bar-bg: #0f151c;
    --panel-bg: rgba(15, 21, 28, 0.92);
    --border: #1e2833;
    --text: #eaf1f7;
    --muted: #8ea3b6;
    --accent: #4fb3ff;
    --red: #ff3b30;
    --blue: #5ec8ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  #app {
    position: relative;
    height: 100vh;
    width: 100vw;
  }

  /* Top bar */
  #topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--bar-height);
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    z-index: 10;
    padding: 0 20px;
  }

  #logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  #logo img {
    height: calc(var(--bar-height) - 14px);
    max-height: 100%;
    width: auto;
    display: block;
  }

  #logo .logo-fallback {
    height: 44px;
    width: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: #05131f;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  #title {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  #spacer {
    flex: 1;
  }

  /* Map fills remaining space below bar */
  #map {
    position: absolute;
    top: var(--bar-height);
    left: 0;
    right: 0;
    bottom: 0;
  }

  /* Slot for floating panels */
  #panels {
    position: absolute;
    top: var(--bar-height);
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 5;
  }
  #panels > * {
    pointer-events: auto;
  }

  .mapboxgl-ctrl-logo,
  .mapboxgl-ctrl-attrib {
    opacity: 0.6;
  }

  /* Legend */
  #legend {
    position: absolute;
    left: 16px;
    bottom: 16px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--text);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #legend .legend-title {
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #legend .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  #legend .legend-row:last-child { margin-bottom: 0; }
  #legend .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    flex-shrink: 0;
  }
  #legend .ring {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid;
    flex-shrink: 0;
  }
  #legend .ring.red { background: var(--red); border-color: var(--red); }
  #legend .ring.blue { background: var(--blue); border-color: var(--blue); }

  /* Floating data sheet */
  #datasheet {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 340px;
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    display: none;
    flex-direction: column;
  }
  #datasheet.open { display: flex; }

  #datasheet .ds-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 16px 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #datasheet .ds-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  #datasheet .ds-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  #datasheet .ds-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  #datasheet .ds-close:hover { color: var(--text); }

  #datasheet .ds-body {
    padding: 14px 16px 18px 16px;
    font-size: 13px;
  }

  .ds-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 10px;
  }
  .ds-badge.dec { background: rgba(255,59,48,0.15); color: var(--red); }
  .ds-badge.inc { background: rgba(94,200,255,0.15); color: var(--blue); }
  .ds-badge.stb { background: rgba(142,163,182,0.15); color: var(--muted); }
  .ds-badge .dotmini { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .ds-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .ds-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .ds-stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .ds-stat .v { font-size: 15px; font-weight: 700; margin-top: 2px; }

  .ds-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin: 18px 0 8px 0;
  }

  table.ds-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.ds-table th, table.ds-table td {
    text-align: right;
    padding: 5px 4px;
    border-bottom: 1px solid var(--border);
  }
  table.ds-table th:first-child, table.ds-table td:first-child {
    text-align: left;
  }
  table.ds-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
  }
  table.ds-table td.neg { color: var(--red); }
  table.ds-table td.pos { color: var(--blue); }

  .ds-empty {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }

  .ds-footer-note {
    margin-top: 16px;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  #datasheet::-webkit-scrollbar { width: 8px; }
  #datasheet::-webkit-scrollbar-thumb { background: #263340; border-radius: 8px; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="logo">
      <img id="ndma-logo" src="ndma-logo.png" alt="NDMA" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div class="logo-fallback" style="display:none;">NDMA</div>
    </div>
    <div id="title">HKH Glacier Watch</div>
    <div id="spacer"></div>
  </div>

  <div id="map"></div>

  <div id="panels">
    <div id="legend">
      <div class="legend-title">Glacier status</div>
      <div class="legend-row"><span class="dot"></span> Glacier location</div>
      <div class="legend-row"><span class="ring red"></span> Retreating / thinning</div>
      <div class="legend-row"><span class="ring blue"></span> Stable / gaining</div>
      <div class="legend-row" style="margin-top:4px; opacity:0.75;">Numbered circles are clusters — click or zoom in</div>

      <div class="legend-title" style="margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>ERA5 temp (2m, Jun 2020)</span>
        <label style="display:inline-flex; align-items:center; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400;">
          <input type="checkbox" id="era5-toggle" style="cursor:pointer;" />
        </label>
      </div>
      <div id="era5-scale" style="display:none;">
        <div style="height:10px; border-radius:4px; background:linear-gradient(to right, #000080,#0000d9,#4000ff,#8000ff,#0080ff,#00ffff,#00ff80,#80ff00,#daff00,#ffff00,#fff500,#ffda00,#ffb000,#ffa400,#ff4f00,#ff2500,#ff0a00,#ff00ff);"></div>
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px;">
          <span>-23°C</span><span>47°C</span>
        </div>
      </div>

      <div class="legend-title" style="margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span style="display:inline-flex; align-items:center; gap:6px;"><span style="width:12px; height:12px; border-radius:2px; background:rgba(255,204,0,0.15); border:1.5px solid #ffcc00; display:inline-block;"></span>Study area boundary</span>
        <label style="display:inline-flex; align-items:center; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400;">
          <input type="checkbox" id="boundary-toggle" style="cursor:pointer;" checked />
        </label>
      </div>
    </div>

    <div id="datasheet">
      <div class="ds-header">
        <div>
          <div class="ds-title" id="ds-name">—</div>
          <div class="ds-sub" id="ds-sub">—</div>
        </div>
        <button class="ds-close" id="ds-close" title="Close">✕</button>
      </div>
      <div class="ds-body" id="ds-body">
        <!-- filled by JS -->
      </div>
    </div>
  </div>
</div>

<script src="glacier_data.js"></script>
<script src="hkh_boundary_data.js"></script>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiemVlc2hhbjEwIiwiYSI6ImNtMXN0YXVhbTBhYnIybHNhOHRheHRwOWoifQ.vgmSlaE3lAnZPy59Ni7SkQ';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-streets-v12',
    projection: 'globe',
    center: [82.5, 32.0], // Hindu Kush Himalaya region
    zoom: 2.5,
    pitch: 0,
    attributionControl: true
  });
  window.map = map; // exposed for debugging / future floating panels

  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
  map.scrollZoom.enable();

  const COUNTRY_NAMES = {
    AF: 'Afghanistan', PK: 'Pakistan', IN: 'India', CN: 'China',
    NP: 'Nepal', BT: 'Bhutan', MM: 'Myanmar', TJ: 'Tajikistan'
  };

  map.on('style.load', () => {
    map.setFog({
      color: 'rgb(20, 27, 34)',
      'high-color': 'rgb(36, 52, 68)',
      'horizon-blend': 0.03,
      'space-color': 'rgb(5, 8, 12)',
      'star-intensity': 0.4
    });
  });

  map.on('load', () => {
    // ERA5 monthly mean 2m air temperature (HKH region, last available month: Jun 2020 --
    // ECMWF/ERA5/MONTHLY was discontinued after this date). Added first so it renders
    // beneath the glacier marker layers.
    map.addSource('era5-temp', {
      type: 'raster',
      tiles: ['https://earthengine.googleapis.com/v1/projects/my-project-3191-1760691930746/maps/0fa689973a796d73332077a569d08adb-e44efd6dccec4e1fcde17bcd3549a71d/tiles/{z}/{x}/{y}'],
      tileSize: 256,
      attribution: 'ERA5 (ECMWF) via Google Earth Engine'
    });
    map.addLayer({
      id: 'era5-temp-layer',
      type: 'raster',
      source: 'era5-temp',
      layout: { visibility: 'none' },
      paint: { 'raster-opacity': 0.65 }
    });

    // HKH region boundary (from GEE asset projects/endless-gamma-379613/assets/HKH)
    map.addSource('hkh-boundary', {
      type: 'geojson',
      data: HKH_BOUNDARY_DATA
    });
    map.addLayer({
      id: 'hkh-boundary-fill',
      type: 'fill',
      source: 'hkh-boundary',
      paint: { 'fill-color': '#ffcc00', 'fill-opacity': 0.03 }
    });
    map.addLayer({
      id: 'hkh-boundary-line',
      type: 'line',
      source: 'hkh-boundary',
      paint: { 'line-color': '#ffcc00', 'line-width': 2, 'line-opacity': 0.85 }
    });

    map.addSource('glaciers', {
      type: 'geojson',
      data: GLACIER_DATA,
      cluster: true,
      clusterRadius: 45,
      clusterMaxZoom: 8,
      clusterProperties: {
        dec: ['+', ['case', ['==', ['get', 'trend'], -1], 1, 0]],
        inc: ['+', ['case', ['==', ['get', 'trend'], 1], 1, 0]]
      }
    });

    const decRatio = ['/', ['get', 'dec'], ['get', 'point_count']];

    // Cluster fill -- white, sized by how many glaciers it holds
    map.addLayer({
      id: 'cluster-dots',
      type: 'circle',
      source: 'glaciers',
      filter: ['has', 'point_count'],
      paint: {
        'circle-radius': ['step', ['get', 'point_count'], 10, 25, 14, 100, 18, 500, 24, 2000, 32],
        'circle-color': '#ffffff',
        'circle-opacity': 0.95
      }
    });

    // Cluster ring -- colored by the dominant trend inside the cluster, blinks like a single point
    map.addLayer({
      id: 'cluster-outline',
      type: 'circle',
      source: 'glaciers',
      filter: ['has', 'point_count'],
      paint: {
        'circle-radius': ['step', ['get', 'point_count'], 10, 25, 14, 100, 18, 500, 24, 2000, 32],
        'circle-color': '#000000',
        'circle-opacity': 0,
        'circle-stroke-color': ['step', decRatio, '#5ec8ff', 0.4, '#8ea3b6', 0.6, '#ff3b30'],
        'circle-stroke-width': 2,
        'circle-stroke-opacity': 1
      }
    });

    map.addLayer({
      id: 'cluster-count',
      type: 'symbol',
      source: 'glaciers',
      filter: ['has', 'point_count'],
      layout: {
        'text-field': ['get', 'point_count_abbreviated'],
        'text-size': 12,
        'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold']
      },
      paint: {
        'text-color': '#0b0f14'
      }
    });

    // Base white dots -- individual glaciers (once a cluster breaks apart)
    map.addLayer({
      id: 'glacier-dots',
      type: 'circle',
      source: 'glaciers',
      filter: ['!', ['has', 'point_count']],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 1.4, 5, 2.4, 8, 4, 12, 7],
        'circle-color': ['match', ['get', 'trend'], -1, '#ff3b30', 1, '#5ec8ff', '#ffffff'],
        'circle-opacity': 0.95,
        'circle-stroke-width': 0
      }
    });

    // Blinking red outline -- retreating / thinning glaciers
    map.addLayer({
      id: 'glacier-outline-decreasing',
      type: 'circle',
      source: 'glaciers',
      filter: ['all', ['!', ['has', 'point_count']], ['==', ['get', 'trend'], -1]],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 3, 5, 5, 8, 8, 12, 13],
        'circle-color': '#000000',
        'circle-opacity': 0,
        'circle-stroke-color': '#ff3b30',
        'circle-stroke-width': 2,
        'circle-stroke-opacity': 1
      }
    });

    // Blinking blue outline -- stable / gaining glaciers
    map.addLayer({
      id: 'glacier-outline-increasing',
      type: 'circle',
      source: 'glaciers',
      filter: ['all', ['!', ['has', 'point_count']], ['==', ['get', 'trend'], 1]],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 3, 5, 5, 8, 8, 12, 13],
        'circle-color': '#000000',
        'circle-opacity': 0,
        'circle-stroke-color': '#5ec8ff',
        'circle-stroke-width': 2,
        'circle-stroke-opacity': 1
      }
    });

    // Cheap global blink loop -- animates layer-wide paint props, not per-feature
    let t0 = performance.now();
    function blink(now) {
      const dt = (now - t0) / 1000;
      const pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(dt * 2.4));      // 0.35 - 1.0
      const widthPulse = 1.4 + 1.8 * (0.5 + 0.5 * Math.sin(dt * 2.4));   // 1.4 - 3.2
      map.setPaintProperty('glacier-outline-decreasing', 'circle-stroke-opacity', pulse);
      map.setPaintProperty('glacier-outline-decreasing', 'circle-stroke-width', widthPulse);
      map.setPaintProperty('glacier-outline-increasing', 'circle-stroke-opacity', pulse);
      map.setPaintProperty('glacier-outline-increasing', 'circle-stroke-width', widthPulse);
      map.setPaintProperty('cluster-outline', 'circle-stroke-opacity', pulse);
      map.setPaintProperty('cluster-outline', 'circle-stroke-width', widthPulse);
      requestAnimationFrame(blink);
    }
    requestAnimationFrame(blink);

    // Cursor affordance
    ['glacier-dots', 'cluster-dots'].forEach((layer) => {
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    });

    // Clicking a cluster zooms in until it breaks apart
    map.on('click', 'cluster-dots', (e) => {
      const f = e.features[0];
      const clusterId = f.properties.cluster_id;
      map.getSource('glaciers').getClusterExpansionZoom(clusterId, (err, zoom) => {
        if (err) return;
        map.easeTo({ center: f.geometry.coordinates, zoom });
      });
    });

    // Clicking an individual glacier opens the data sheet
    map.on('click', 'glacier-dots', (e) => {
      const f = e.features[0];
      openDataSheet(f);
    });
  });

  // ---------- ERA5 temperature layer toggle ----------
  document.getElementById('era5-toggle').addEventListener('change', (e) => {
    const visible = e.target.checked;
    map.setLayoutProperty('era5-temp-layer', 'visibility', visible ? 'visible' : 'none');
    document.getElementById('era5-scale').style.display = visible ? 'block' : 'none';
  });

  // ---------- Study area boundary layer toggle ----------
  document.getElementById('boundary-toggle').addEventListener('change', (e) => {
    const visible = e.target.checked ? 'visible' : 'none';
    map.setLayoutProperty('hkh-boundary-fill', 'visibility', visible);
    map.setLayoutProperty('hkh-boundary-line', 'visibility', visible);
  });

  // ---------- Floating data sheet ----------
  const sheet = document.getElementById('datasheet');
  const dsName = document.getElementById('ds-name');
  const dsSub = document.getElementById('ds-sub');
  const dsBody = document.getElementById('ds-body');
  document.getElementById('ds-close').addEventListener('click', () => sheet.classList.remove('open'));

  function fmt(v, unit) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    return v + (unit || '');
  }

  // Mapbox GL flattens nested arrays/objects in GeoJSON properties into
  // JSON strings when they pass through the vector-tile pipeline -- parse them back.
  function parseMaybeJSON(v) {
    if (typeof v !== 'string') return v || null;
    try { return JSON.parse(v); } catch (e) { return null; }
  }

  function openDataSheet(feature) {
    const p = feature.properties;
    p.p = parseMaybeJSON(p.p);
    p.mb = parseMaybeJSON(p.mb);
    p.fv = parseMaybeJSON(p.fv);
    const coords = feature.geometry.coordinates;
    const lon = coords[0], lat = coords[1];
    const countryName = COUNTRY_NAMES[p.country] || p.country;

    const displayName = p.name && p.name !== 'null' ? p.name : 'Unnamed Glacier';
    dsName.textContent = displayName;
    dsSub.textContent = `${countryName} · ${lat.toFixed(3)}°, ${lon.toFixed(3)}° · Ref: ${p.ref}`;

    let badge = '';
    if (p.trend === -1) {
      badge = `<div class="ds-badge dec"><span class="dotmini"></span> Retreating / Thinning</div>`;
    } else if (p.trend === 1) {
      badge = `<div class="ds-badge inc"><span class="dotmini"></span> Stable / Gaining</div>`;
    } else {
      badge = `<div class="ds-badge stb"><span class="dotmini"></span> No significant trend</div>`;
    }

    const rate = p.rate;
    const rateStr = rate === null || rate === undefined ? '—' : (rate > 0 ? '+' : '') + rate.toFixed(2) + ' m/yr';
    const areaStr = p.area !== null && p.area !== undefined ? p.area.toFixed(2) + ' km²' : '—';

    let stats = `
      <div class="ds-stats">
        <div class="ds-stat"><div class="k">Elevation change rate</div><div class="v">${rateStr}</div></div>
        <div class="ds-stat"><div class="k">Glacier area</div><div class="v">${areaStr}</div></div>
      </div>
    `;

    // 1999-2019 elevation change sub-period table
    let periodsRows = '';
    if (p.p && p.p.length) {
      const sorted = [...p.p].sort((a, b) => a[0] - b[0]);
      periodsRows = sorted.map(row => {
        const [b, e, ec, vc] = row;
        const ecCls = ec < 0 ? 'neg' : (ec > 0 ? 'pos' : '');
        const vcCls = vc < 0 ? 'neg' : (vc > 0 ? 'pos' : '');
        return `<tr>
          <td>${b}–${e}</td>
          <td class="${ecCls}">${ec !== null ? ec.toFixed(2) : '—'} m</td>
          <td class="${vcCls}">${vc !== null ? vc.toFixed(3) : '—'} Mm³</td>
        </tr>`;
      }).join('');
    }

    let periodsTable = periodsRows ? `
      <div class="ds-section-title">Elevation &amp; volume change (Hugonnet et al. 2021)</div>
      <table class="ds-table">
        <thead><tr><th>Period</th><th>Elev. Δ</th><th>Vol. Δ</th></tr></thead>
        <tbody>${periodsRows}</tbody>
      </table>
    ` : `<div class="ds-section-title">Elevation &amp; volume change</div><div class="ds-empty">No satellite change data available.</div>`;

    // Mass balance (rare)
    let mbBlock = '';
    if (p.mb && p.mb.length) {
      const rows = [...p.mb].sort((a, b) => a[0] - b[0]).map(([y, ab]) => {
        const cls = ab < 0 ? 'neg' : (ab > 0 ? 'pos' : '');
        return `<tr><td>${y}</td><td class="${cls}">${ab} mm w.e.</td></tr>`;
      }).join('');
      mbBlock = `
        <div class="ds-section-title">Field mass balance</div>
        <table class="ds-table">
          <thead><tr><th>Year</th><th>Annual balance</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // Front variation (rare)
    let fvBlock = '';
    if (p.fv && p.fv.length) {
      const rows = [...p.fv].sort((a, b) => a[0] - b[0]).map(([b, e, lc]) => {
        const cls = lc < 0 ? 'neg' : (lc > 0 ? 'pos' : '');
        return `<tr><td>${b}–${e}</td><td class="${cls}">${lc} m</td></tr>`;
      }).join('');
      fvBlock = `
        <div class="ds-section-title">Terminus (front) variation</div>
        <table class="ds-table">
          <thead><tr><th>Period</th><th>Length change</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    dsBody.innerHTML = `
      ${badge}
      ${stats}
      ${periodsTable}
      ${mbBlock}
      ${fvBlock}
      <div class="ds-footer-note">Source: World Glacier Monitoring Service (WGMS) Fluctuations of Glaciers Database. Elevation/volume change from Hugonnet et al. (2021), Nature 592, 726–731. Glacier ID ${p.id}.</div>
    `;

    sheet.classList.add('open');
  }
</script>

</body>
</html>
